services:
  - type: web
    name: flightwatch
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SERPAPI_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: "Passagens Baratas ✈️"
      - key: SMTP_USE_TLS
        value: "true"
      - key: CHECK_INTERVAL_MINUTES
        value: "60"
      - key: DATABASE_URL
        value: sqlite:////var/data/flight_alerts.db
    disk:
      name: flightwatch-data
      mountPath: /var/data
      sizeGB: 1
